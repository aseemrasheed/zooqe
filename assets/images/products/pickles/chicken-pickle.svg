<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="radialGlow" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#242432" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0f0f14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0be"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997515"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#888899"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="800" fill="url(#radialGlow)"/>

  <!-- Subtle Minimal Luxury Grid Frame -->
  <rect x="32" y="32" width="736" height="736" rx="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <rect x="44" y="44" width="712" height="712" rx="12" fill="none" stroke="rgba(212,175,55,0.18)" stroke-width="1"/>

  <!-- Corner Geometric Luxury Accents -->
  <path d="M 44,70 L 44,44 L 70,44" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <path d="M 756,70 L 756,44 L 730,44" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <path d="M 44,730 L 44,756 L 70,756" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <path d="M 756,730 L 756,756 L 730,756" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Top Header Pill -->
  <g transform="translate(400, 100)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(212,175,55,0.3)" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#d4af37" text-anchor="middle" letter-spacing="3">KERALA HERITAGE ACHAR</text>
  </g>

  <!-- Central Silhouette Graphic -->
  
          <!-- Luxury Ceramic & Glass Achar Jar Silhouette -->
          <g filter="url(#shadow)">
            <!-- Jar Lid & Golden Seal -->
            <rect x="340" y="220" width="120" height="24" rx="6" fill="url(#goldGrad)" />
            <rect x="330" y="244" width="140" height="18" rx="4" fill="#1c1c24" stroke="url(#goldGrad)" stroke-width="2" />
            <path d="M 335,262 Q 400,270 465,262" stroke="#d4af37" stroke-width="3" fill="none" />
            <!-- Jar Body -->
            <path d="M 310,270 C 270,300 270,470 300,530 C 320,560 480,560 500,530 C 530,470 530,300 490,270 Z" fill="#15151c" stroke="url(#goldGrad)" stroke-width="3" />
            <!-- Jar Inner Tone & Texture -->
            <path d="M 320,290 C 285,320 285,460 310,515 C 330,545 470,545 490,515 C 515,460 515,320 480,290 Z" fill="#1a1a24" opacity="0.85" />
            <!-- Luxury Label Band -->
            <rect x="325" y="350" width="150" height="90" rx="6" fill="#0c0c10" stroke="rgba(212,175,55,0.4)" stroke-width="1.5" />
            <text x="400" y="380" font-family="'Cinzel', 'Playfair Display', serif" font-size="13" font-weight="700" fill="#d4af37" text-anchor="middle" letter-spacing="3">ZOOQE</text>
            <line x1="355" y1="392" x2="445" y2="392" stroke="#d4af37" stroke-width="1" opacity="0.6" />
            <text x="400" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1">AUTHENTIC</text>
            <text x="400" y="428" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#9999aa" text-anchor="middle">ACHAR</text>
          </g>
        

  <!-- Bottom Typography Area -->
  <g transform="translate(400, 620)">
    <!-- Main Product Title -->
    <text x="0" y="0" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">CHICKEN PICKLE</text>
    <!-- Subtitle / Notes -->
    <text x="0" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="400" fill="#9e9eb0" text-anchor="middle">Spicy Authentic Kerala Style Chicken Achar</text>
    
    <!-- Drop Custom Photo Guidance Banner -->
    <rect x="-190" y="55" width="380" height="32" rx="6" fill="#0a0a0f" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="0" y="75" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="11.5" font-weight="500" fill="#7a7a8c" text-anchor="middle">
      Drop Custom Photo: <tspan fill="#f59e0b" font-weight="600">chicken-pickle.jpg</tspan>
    </text>
  </g>
</svg>