<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_star_anise" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1c1c24"/>
      <stop offset="50%" stop-color="#0c0c0f"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <radialGradient id="spiceGlow_star_anise" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4A2412" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="goldBorder_star_anise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2d6"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#8c6614"/>
      <stop offset="100%" stop-color="#e6be68"/>
    </linearGradient>
    <linearGradient id="silverPlaque_star_anise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cfcfd4"/>
      <stop offset="100%" stop-color="#7a7a80"/>
    </linearGradient>
    <filter id="shadow_star_anise" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="22" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="600" height="600" fill="url(#bgGlow_star_anise)"/>

  <!-- Concentric Luxury Rings -->
  <circle cx="300" cy="275" r="230" fill="none" stroke="rgba(212,175,55,0.06)" stroke-width="1"/>
  <circle cx="300" cy="275" r="180" fill="none" stroke="rgba(212,175,55,0.08)" stroke-width="1" stroke-dasharray="6 8"/>
  <circle cx="300" cy="275" r="130" fill="none" stroke="rgba(212,175,55,0.12)" stroke-width="1"/>

  <!-- Warm Spice Ambient Halo -->
  <circle cx="300" cy="275" r="170" fill="url(#spiceGlow_star_anise)" opacity="0.6"/>

  <!-- Pedestal Base Shadow -->
  <ellipse cx="300" cy="455" rx="190" ry="26" fill="#000000" opacity="0.95" filter="url(#shadow_star_anise)"/>
  <ellipse cx="300" cy="448" rx="150" ry="14" fill="url(#goldBorder_star_anise)" opacity="0.2"/>

  <!-- Centerpiece Vessel / Luxury Matte Black Craft Pouch / Jar -->
  <g filter="url(#shadow_star_anise)">
    <!-- Pouch / Jar Body -->
    <rect x="185" y="150" width="230" height="270" rx="18" fill="#101014" stroke="url(#goldBorder_star_anise)" stroke-width="1.5"/>
    
    <!-- Transparent spice window / inner aura -->
    <rect x="198" y="162" width="204" height="246" rx="12" fill="#4A2412" opacity="0.45"/>

    <!-- Spice Graphics -->
    <g>
      
        <!-- Star Anise / Thakkolam (8-pointed star) -->
        <g transform="translate(300, 275)">
          <path d="M 0,-40 L 9,-10 L 40,0 L 9,10 L 0,40 L -9,10 L -40,0 L -9,-10 Z" fill="#5C2D16" stroke="#823F1F" stroke-width="1.5"/>
          <path d="M -28,-28 L 0,-12 L 28,-28 L 12,0 L 28,28 L 0,12 L -28,28 L -12,0 Z" fill="#6E361B" stroke="#8E4623" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="8" fill="#3D1E0E"/>
          <ellipse cx="0" cy="-22" rx="3" ry="5" fill="#A0522D"/>
          <ellipse cx="22" cy="0" rx="5" ry="3" fill="#A0522D"/>
          <ellipse cx="0" cy="22" rx="3" ry="5" fill="#A0522D"/>
          <ellipse cx="-22" cy="0" rx="5" ry="3" fill="#A0522D"/>
        </g>
        
    </g>

    <!-- Luxury Gold & Obsidian Label Plaque -->
    <rect x="210" y="225" width="180" height="155" rx="8" fill="#09090C" stroke="url(#goldBorder_star_anise)" stroke-width="1.2"/>
    
    <!-- ZOOQE Crest Monogram -->
    <circle cx="300" cy="255" r="16" fill="none" stroke="url(#goldBorder_star_anise)" stroke-width="1"/>
    <text x="300" y="260" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#f7df99" text-anchor="middle" letter-spacing="1">ZQ</text>

    <!-- Brand & Spice Name on Label -->
    <text x="300" y="290" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ZOOQE</text>
    <line x1="235" y1="300" x2="365" y2="300" stroke="url(#goldBorder_star_anise)" stroke-width="0.8" opacity="0.8"/>
    <text x="300" y="318" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#f7df99" text-anchor="middle" letter-spacing="1.2">STAR ANISE (THAKKOLAM)</text>
    <text x="300" y="334" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="8" font-weight="600" fill="#a1a1a8" text-anchor="middle" letter-spacing="0.8">EIGHT-POINT WHOLE (THAKKOLAM)</text>
    <text x="300" y="352" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="7.5" fill="#d4af37" text-anchor="middle" letter-spacing="1.5">✦ SINGLE ORIGIN MALABAR ✦</text>

    <!-- Metallic Gold Cap / Seal -->
    <rect x="215" y="115" width="170" height="42" rx="6" fill="url(#goldBorder_star_anise)" stroke="#fff2d6" stroke-width="0.6"/>
    <line x1="220" y1="128" x2="380" y2="128" stroke="#8c6614" stroke-width="1"/>
    <line x1="220" y1="138" x2="380" y2="138" stroke="#8c6614" stroke-width="1"/>
    <rect x="255" y="103" width="90" height="15" rx="3" fill="url(#goldBorder_star_anise)"/>
  </g>

  <!-- Bottom Captions -->
  <text x="300" y="525" font-family="'Cinzel', serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">Star Anise (Thakkolam)</text>
  <text x="300" y="550" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#d4af37" text-anchor="middle" letter-spacing="1">Whole Autumn Harvest 8-Pointed Star Anise Pods</text>
</svg>
