<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="radialGlow_almonds" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#1e1e28" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0f0f14" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad_almonds" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0be"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997515"/>
    </linearGradient>
    <filter id="shadow_almonds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="800" fill="url(#radialGlow_almonds)"/>

  <!-- Subtle Minimal Luxury Grid Frame -->
  <rect x="32" y="32" width="736" height="736" rx="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <rect x="44" y="44" width="712" height="712" rx="12" fill="none" stroke="rgba(212,175,55,0.22)" stroke-width="1"/>

  <!-- Corner Geometric Luxury Accents -->
  <path d="M 44,70 L 44,44 L 70,44" fill="none" stroke="url(#goldGrad_almonds)" stroke-width="3"/>
  <path d="M 756,70 L 756,44 L 730,44" fill="none" stroke="url(#goldGrad_almonds)" stroke-width="3"/>
  <path d="M 44,730 L 44,756 L 70,756" fill="none" stroke="url(#goldGrad_almonds)" stroke-width="3"/>
  <path d="M 756,730 L 756,756 L 730,756" fill="none" stroke="url(#goldGrad_almonds)" stroke-width="3"/>

  <!-- Top Header Pill -->
  <g transform="translate(400, 105)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(212,175,55,0.35)" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#d4af37" text-anchor="middle" letter-spacing="3">ZOOQE • ARTISANAL HARVEST</text>
  </g>

  <!-- Central Silhouette Graphic -->
  <g filter="url(#shadow_almonds)">
    <!-- Outer Golden Bowl / Dish -->
    <ellipse cx="400" cy="390" rx="160" ry="110" fill="#15151c" stroke="url(#goldGrad_almonds)" stroke-width="3" />
    <ellipse cx="400" cy="390" rx="138" ry="92" fill="#0e0e14" stroke="rgba(212,175,55,0.3)" stroke-width="1.5" stroke-dasharray="6,4" />
    
    <!-- Central Luxury Seal -->
    <circle cx="400" cy="390" r="54" fill="#1b1b24" stroke="url(#goldGrad_almonds)" stroke-width="2"/>
    <polygon points="400,356 414,380 440,380 419,396 427,422 400,404 373,422 381,396 360,380 386,380" fill="url(#goldGrad_almonds)" opacity="0.9"/>
  </g>

  <!-- Lower Brand & Product Typography -->
  <g transform="translate(400, 575)" text-anchor="middle">
    <text y="0" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="2">ALMONDS</text>
    <text y="30" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a0a0b0" letter-spacing="1">Prime California Grade Sweet Almonds</text>
    <line x1="-60" y1="52" x2="60" y2="52" stroke="url(#goldGrad_almonds)" stroke-width="2"/>
    <text y="74" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#d4af37" letter-spacing="4">PREMIUM RESERVE QUALITY</text>
  </g>
</svg>